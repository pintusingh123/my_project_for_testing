      <input
       type="text"
       placeholder="Enter Your name" id="customerName" />

      <input
       type="number" placeholder="Initial Balance" id="balance" />

    </form>

    <!-- form for deposit ammount  -->
     <hr>
      <form id="DepositForm">
        <input
        type="number"
        placeholder="Enter Your name" id="customerNameForDeposit" />
  
        <input
        type="number" placeholder="Deposit Amount" id="depositAmount" />
          <button  >Deposit</button>
    <script src="./constructor.js"></script>
